name: Maestro Suite

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash -s 2.10.0
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator and run suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none -memory 4096
          ram-size: 4096M
          disable-animations: true
          script: |
            export MAESTRO_DRIVER_STARTUP_TIMEOUT=120000
            
            echo "==> Installing the APK..."
            adb install -r techshop.apk
            
            mkdir -p reports/debug
            echo "==> Starting logcat capture in background..."
            adb logcat -c
            adb logcat -v time > reports/debug/logcat.txt &
            
            echo "==> Running Maestro suite..."
            maestro test -e EMAIL="${{ secrets.TEST_EMAIL }}" -e PASSWORD="${{ secrets.TEST_PASSWORD }}" --format junit --output reports/result.xml --debug-output reports/debug --test-output-dir reports/debug flows/

      - name: Generate consolidated report
        if: always()
        run: node generate-report.js reports/debug reports/consolidated-report.html

      - name: Publish JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-report
          path: reports/result.xml

      - name: Publish debug-output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: maestro-debug-output
          path: reports/debug/

      - name: Prepare report site
        if: always()
        run: |
          mkdir -p site
          if [ -f reports/consolidated-report.html ]; then
            cp reports/consolidated-report.html site/index.html
          else
            printf '<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Test Report</title></head><body><p>No report generated in this run.</p></body></html>' > site/index.html
          fi
          if [ -d reports/debug ]; then
            cp -r reports/debug site/debug
          fi

      - name: Configure Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Publish Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Show result in Actions
        uses: dorny/test-reporter@v1
        if: always() && hashFiles('reports/result.xml') != ''
        with:
          name: Maestro Suite
          path: reports/result.xml
          reporter: java-junit
          fail-on-error: false

  publish-report:
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && github.event_name == 'push' }}
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Link to report in summary
        run: |
          echo "Report: ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
